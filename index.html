<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12261a">
<title>Ogród Bloków</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #12261a; overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, "Segoe UI", sans-serif; color: #f3f7ea; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: calc(12px + env(safe-area-inset-top)) 14px 0; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #score { font-weight: 900; font-size: 34px; text-align: center; color: #fff; text-shadow: 0 2px 0 #0a170f; }
  #best { font-size: 13px; text-align: center; color: #b9d3a8; }
  .btn { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); color: #f3f7ea;
    border-radius: 16px; padding: 10px 14px; font: 600 15px system-ui, sans-serif; cursor: pointer; min-width: 44px; }
  .btn:active { transform: scale(.95); }
  .ov { position: fixed; inset: 0; display: none; place-items: center; background: rgba(8,20,12,.74);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
  .ov.show { display: grid; }
  .card { text-align: center; padding: 24px; max-width: 320px; }
  .card h1 { margin: 0 0 6px; font-size: 42px; line-height: 1.05; color: #ffe27a; text-shadow: 0 3px 0 #6b4a12; }
  .card h2 { margin: 0 0 8px; font-size: 30px; color: #ffe27a; }
  .card p { color: #cfe2c2; margin: 8px 0 22px; line-height: 1.45; }
  .big { background: #ffd35a; color: #3a2600; border: 0; border-radius: 22px; padding: 14px 40px;
    font: 800 20px system-ui, sans-serif; box-shadow: 0 5px 0 #b8861d; cursor: pointer; }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8861d; }
  .num { font-size: 52px; font-weight: 900; color: #fff; margin: 4px 0; }
  .sec { background: rgba(255,255,255,.1); color: #f3f7ea; border: 1px solid rgba(255,227,122,.5); border-radius: 18px;
    padding: 12px 18px; font: 700 16px system-ui, sans-serif; cursor: pointer; margin-top: 12px; width: 100%; }
  .sec small { display: block; font-weight: 500; font-size: 12px; color: #b9d3a8; margin-top: 2px; }
  .sec:active { transform: scale(.97); }
  .rank { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 10px 12px; margin-top: 16px; text-align: left; }
  .rank .t { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; gap: 8px; }
  .rank .t span:last-child { color: #b9d3a8; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rank .s { font-size: 12px; color: #b9d3a8; margin-top: 2px; }
  .bar { height: 6px; background: rgba(0,0,0,.35); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #ffd35a; border-radius: 3px; }
  .card { padding-top: calc(20px + env(safe-area-inset-top)); padding-bottom: calc(20px + env(safe-area-inset-bottom)); width: 100%; box-sizing: border-box; }
  .ov { overflow-y: auto; }
  #mode { font-size: 11px; text-align: center; color: #ffd35a; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; min-height: 13px; }
  .ov { scrollbar-width: none; }
  .ov::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <button class="btn" id="snd" aria-label="Dźwięk">🔊</button>
  <div><div id="mode"></div><div id="score">0</div><div id="best">rekord 0</div></div>
  <button class="btn" id="menuBtn" aria-label="Menu">☰</button>
</div>

<div class="ov show" id="menu"><div class="card">
  <h1>Ogród<br>Bloków</h1>
  <p>Przeciągaj klocki na grządki. Pełny rząd albo kolumna zakwita i znika. Złote kwiaty dają dodatkowe punkty. Gra trwa, dopóki masz gdzie sadzić!</p>
  <button class="big" id="play">Graj</button>
  <button class="sec" id="daily">🌼 Wyzwanie dnia<small id="dailyInfo"></small></button>
  <div class="rank" id="rank"></div>
</div></div>

<div class="ov" id="over"><div class="card">
  <h2 id="overT">Brak miejsca!</h2>
  <div class="num" id="final">0</div>
  <p id="overInfo"></p>
  <div class="rank" id="overRank"></div>
  <p></p>
  <button class="big" id="again">Jeszcze raz</button>
  <button class="sec" id="toMenu">Menu</button>
</div></div>

<script>
'use strict';
const N = 8;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let best = store.get('ob_best', 0), muted = store.get('ob_muted', false);
let lines = store.get('ob_lines', 0), streak = store.get('ob_streak', { last: '', n: 0 });
let mode = 'classic', rand = Math.random, runLines = 0;

// wyzwanie dnia: ten sam ciąg klocków dla wszystkich graczy danego dnia
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dailyBest = () => store.get('ob_daily_' + dayKey(), 0);
function yesterdayKey() { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); }

// rangi ogrodnika za łączną liczbę zebranych rzędów i kolumn
const RANKS = [[0, 'Nowicjusz'], [25, 'Sadzonka'], [75, 'Pączek'], [150, 'Kwiatek'], [300, 'Ogrodnik'], [500, 'Sadownik'],
  [800, 'Botanik'], [1200, 'Mistrz ogrodu'], [1800, 'Strażnik róż'], [2500, 'Legenda ogrodu']];
function rankHtml() {
  let i = 0; while (i + 1 < RANKS.length && lines >= RANKS[i + 1][0]) i++;
  const next = RANKS[i + 1];
  const pct = next ? Math.round((lines - RANKS[i][0]) / (next[0] - RANKS[i][0]) * 100) : 100;
  return `<div class="t"><span>🌱 ${RANKS[i][1]}</span><span>ranga ${i + 1} / ${RANKS.length}</span></div>
    <div class="s">${next ? `zebrane linie: ${lines} · do rangi „${next[1]}” brakuje ${next[0] - lines}` : `zebrane linie: ${lines} · najwyższa ranga!`}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
}

// kolory kwiatów: [płatek, środek]
const FLOWERS = [['#ff6b8b', '#ffe27a'], ['#ffb347', '#fff1b8'], ['#b48cff', '#ffe27a'], ['#5ac8ff', '#fff'], ['#ff5a5a', '#ffd35a'], ['#ffe14a', '#ff9a3c'], ['#f5f5ff', '#ffd35a'],
  ['#fff6c2', '#ffb300']];
const GOLD = FLOWERS.length - 1, NORMAL = FLOWERS.length - 1, GOLD_BONUS = 25;

// kształty (wiersze z '#')
const SHAPES = [
  ['#'], ['##'], ['#', '#'], ['###'], ['#', '#', '#'], ['####'], ['#', '#', '#', '#'], ['#####'], ['#', '#', '#', '#', '#'],
  ['##', '##'], ['###', '###', '###'], ['##', '#.'], ['##', '.#'], ['#.', '##'], ['.#', '##'],
  ['###', '#..', '#..'], ['###', '..#', '..#'], ['#..', '#..', '###'], ['..#', '..#', '###'],
  ['###', '.#.'], ['.#.', '###'], ['#.', '##', '#.'], ['.#', '##', '.#'],
  ['##.', '.##'], ['.##', '##.'], ['#.', '##', '.#'], ['.#', '##', '#.'],
  ['#..', '###'], ['###', '..#'], ['##', '#.', '#.'], ['##', '.#', '.#'],
];
const WEIGHTS = SHAPES.map(s => { const c = s.join('').split('#').length - 1; return c === 1 ? 2 : c >= 9 ? 1 : 3; });
function shapeCells(s) { const out = []; s.forEach((row, y) => [...row].forEach((ch, x) => ch === '#' && out.push([x, y]))); return out; }
function randShape() {
  const tot = WEIGHTS.reduce((a, b) => a + b, 0); let r = rand() * tot;
  for (let i = 0; i < SHAPES.length; i++) { r -= WEIGHTS[i]; if (r < 0) return i; }
  return 0;
}

// --- dźwięk ---
let actx = null;
function audio() {
  if (muted) return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur = .18, type = 'sine', vol = .12, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const S = {
  pick: () => tone(440, .07, 'triangle', .06),
  place: () => { tone(196, .1, 'sine', .14); tone(392, .06, 'triangle', .04); },
  bad: () => tone(160, .12, 'square', .04),
  clear: (n, combo) => { const base = 523 * Math.pow(1.06, Math.min(combo, 8)); for (let i = 0; i < 3 + n; i++) tone(base * [1, 1.25, 1.5, 2, 2.5, 3][i % 6], .3, 'triangle', .08, i * .06); },
  over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, .35, 'triangle', .08, i * .14)),
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// --- stan ---
let grid, tray, score, combo, state = 'menu', drag = null, pops = [], petals = [], floats = [], shakeT = 0;
function newGame(m = mode) {
  mode = m;
  const d = new Date();
  rand = mode === 'daily' ? rng(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) : Math.random;
  grid = Array.from({ length: N }, () => Array(N).fill(-1));
  score = 0; combo = 0; runLines = 0; pops = []; petals = []; floats = [];
  $('menu').classList.remove('show'); $('over').classList.remove('show');
  refill(); state = 'play'; hud();
}
function hud() {
  $('score').textContent = score;
  $('mode').textContent = mode === 'daily' ? 'Wyzwanie dnia' : '';
  $('best').textContent = mode === 'daily' ? 'dziś najlepiej ' + Math.max(dailyBest(), score) : 'rekord ' + best;
  $('snd').textContent = muted ? '🔇' : '🔊';
}
function showMenu() {
  state = 'menu';
  const db = dailyBest(), s = streak.last === dayKey() || streak.last === yesterdayKey() ? streak.n : 0;
  $('dailyInfo').textContent = (db ? `dzisiejszy wynik: ${db}` : 'te same klocki dla wszystkich, nowe codziennie') + (s ? ` · seria: ${s} ${s === 1 ? 'dzień' : 'dni'}` : '');
  $('rank').innerHTML = rankHtml();
  $('over').classList.remove('show'); $('menu').classList.add('show');
}
function fits(cells, gx, gy) {
  for (const [x, y] of cells) { const X = gx + x, Y = gy + y; if (X < 0 || Y < 0 || X >= N || Y >= N || grid[Y][X] !== -1) return false; }
  return true;
}
function canPlaceAnywhere(cells) {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (fits(cells, x, y)) return true;
  return false;
}
function refill() {
  for (let tries = 0; tries < 30; tries++) {
    tray = [0, 1, 2].map(() => {
      const s = randShape(), cells = shapeCells(SHAPES[s]);
      const col = cells.length > 1 && rand() < .07 ? GOLD : Math.floor(rand() * NORMAL);
      return { s, cells, col, used: false };
    });
    // w wyzwaniu dnia bez losowania od nowa, żeby każdy dostał dokładnie ten sam ciąg klocków
    if (mode === 'daily' || tray.some(p => canPlaceAnywhere(p.cells))) break;
  }
}

// --- układ ---
let W, H, DPR, cell, bx, by, trayY, slotW;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = 90, trayH = Math.min(150, H * .2);
  cell = Math.floor(Math.min((W - 28) / N, (H - top - trayH - 30) / N));
  bx = (W - cell * N) / 2; by = top + Math.max(0, (H - top - trayH - 30 - cell * N) / 2);
  trayY = by + cell * N + 20 + trayH / 2; slotW = W / 3;
}
addEventListener('resize', resize);

// --- rysowanie ---
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function block(x, y, s, col, alpha = 1, scale = 1) {
  const [petal, mid] = FLOWERS[col];
  const pad = s * .06, w = (s - pad * 2) * scale, cx = x + s / 2, cy = y + s / 2;
  ctx.globalAlpha = alpha;
  // liść / kafel (złoty kwiat ma złoty kafel z połyskiem)
  const gold = col === GOLD;
  ctx.fillStyle = gold ? '#b8860b' : '#2f7a3d'; rr(cx - w / 2, cy - w / 2, w, w, w * .22); ctx.fill();
  ctx.fillStyle = gold ? '#e6b422' : '#3d9a4c'; rr(cx - w / 2, cy - w / 2, w, w * .86, w * .22); ctx.fill();
  if (gold) {
    const k = (performance.now() / 1400 + (x + y) / 400) % 1;
    ctx.save(); rr(cx - w / 2, cy - w / 2, w, w, w * .22); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath();
    const sx = cx - w + k * w * 2.4;
    ctx.moveTo(sx, cy - w / 2); ctx.lineTo(sx + w * .25, cy - w / 2); ctx.lineTo(sx - w * .25, cy + w / 2); ctx.lineTo(sx - w * .5, cy + w / 2); ctx.fill();
    ctx.restore();
  }
  // kwiat
  const pr = w * .2;
  ctx.fillStyle = petal;
  for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 - Math.PI / 2; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * pr, cy - w * .05 + Math.sin(a) * pr, pr * .78, 0, 7); ctx.fill(); }
  ctx.fillStyle = mid; ctx.beginPath(); ctx.arc(cx, cy - w * .05, pr * .62, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}
function pieceBox(p) { const w = Math.max(...p.cells.map(c => c[0])) + 1, h = Math.max(...p.cells.map(c => c[1])) + 1; return { w, h }; }

function draw(t) {
  // tło: trawnik w paski
  ctx.fillStyle = '#163222'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1a3a27';
  for (let y = 0; y < H; y += 40) ctx.fillRect(0, y, W, 20);
  if (state === 'menu') return;
  let ox = 0;
  if (shakeT) { const k = (t - shakeT) / 260; if (k > 1) shakeT = 0; else ox = Math.sin(k * 40) * 5 * (1 - k); }
  // plansza (grządka)
  ctx.fillStyle = '#4a2f1d'; rr(bx - 8 + ox, by - 8, cell * N + 16, cell * N + 16, 16); ctx.fill();
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#5c3b25' : '#63412a';
    rr(bx + x * cell + 2 + ox, by + y * cell + 2, cell - 4, cell - 4, cell * .18); ctx.fill();
  }
  // podgląd miejsca i linii do usunięcia
  let ghost = null;
  if (drag) {
    const g = dropCell();
    if (g && fits(drag.p.cells, g.x, g.y)) {
      ghost = g;
      const tmp = grid.map(r => r.slice());
      for (const [x, y] of drag.p.cells) tmp[g.y + y][g.x + x] = drag.p.col;
      const { rows, cols } = fullLines(tmp);
      ctx.fillStyle = 'rgba(255,230,120,.22)';
      for (const r of rows) { rr(bx + ox, by + r * cell, cell * N, cell, 8); ctx.fill(); }
      for (const c of cols) { rr(bx + c * cell + ox, by, cell, cell * N, 8); ctx.fill(); }
    }
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (grid[y][x] >= 0) block(bx + x * cell + ox, by + y * cell, cell, grid[y][x]);
  if (ghost) for (const [x, y] of drag.p.cells) block(bx + (ghost.x + x) * cell, by + (ghost.y + y) * cell, cell, drag.p.col, .35);
  // znikające kwiaty
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i], k = (t - p.t0) / 320;
    if (k < 0) { block(bx + p.x * cell, by + p.y * cell, cell, p.col); continue; }
    if (k >= 1) { pops.splice(i, 1); continue; }
    block(bx + p.x * cell, by + p.y * cell, cell, p.col, 1 - k, 1 + k * .5);
  }
  // tacka
  const ts = Math.min(cell * .55, 26);
  tray.forEach((p, i) => {
    if (p.used || (drag && drag.i === i)) return;
    const { w, h } = pieceBox(p), cx = slotW * i + slotW / 2;
    const fit = canPlaceAnywhere(p.cells);
    for (const [x, y] of p.cells) block(cx - w * ts / 2 + x * ts, trayY - h * ts / 2 + y * ts, ts, p.col, fit ? 1 : .35);
  });
  // przeciągany klocek
  if (drag) for (const [x, y] of drag.p.cells) block(drag.x + x * cell, drag.y + y * cell, cell, drag.p.col, .95);
  // płatki
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i];
    p.x += p.vx; p.y += p.vy; p.vy += .12; p.vx *= .99; p.a += p.va; p.life -= .014;
    if (p.life <= 0) { petals.splice(i, 1); continue; }
    ctx.save(); ctx.globalAlpha = p.life; ctx.translate(p.x, p.y); ctx.rotate(p.a);
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, 5, 2.6, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  // napisy
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i], k = (t - f.t0) / 1000;
    if (k >= 1) { floats.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - k; ctx.fillStyle = f.c; ctx.font = `900 ${f.size}px system-ui, sans-serif`; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = '#0d1f14'; ctx.strokeText(f.text, f.x, f.y - k * 40); ctx.fillText(f.text, f.x, f.y - k * 40);
  }
  ctx.globalAlpha = 1;
}

function fullLines(g) {
  const rows = [], cols = [];
  for (let i = 0; i < N; i++) {
    if (g[i].every(v => v >= 0)) rows.push(i);
    if (g.every(r => r[i] >= 0)) cols.push(i);
  }
  return { rows, cols };
}

// --- przeciąganie ---
const LIFT = () => cell * 1.6;
function dropCell() {
  if (!drag) return null;
  const x = Math.round((drag.x - bx) / cell), y = Math.round((drag.y - by) / cell);
  return { x, y };
}
function setDragPos(px, py) {
  const { w, h } = pieceBox(drag.p);
  drag.x = px - w * cell / 2; drag.y = py - h * cell - LIFT() + cell * .5;
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  audio();
  if (e.clientY < trayY - 90) return;
  const i = Math.min(2, Math.floor(e.clientX / slotW)), p = tray[i];
  if (!p || p.used) return;
  drag = { i, p, x: 0, y: 0 }; setDragPos(e.clientX, e.clientY); S.pick();
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (drag) setDragPos(e.clientX, e.clientY); });
const end = () => {
  if (!drag) return;
  const g = dropCell(), p = drag.p;
  if (g && fits(p.cells, g.x, g.y)) place(p, g.x, g.y);
  else if (g && g.x > -3 && g.y > -3 && g.x < N && g.y < N) { S.bad(); shakeT = performance.now(); }
  drag = null;
};
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', () => drag = null);

function place(p, gx, gy) {
  for (const [x, y] of p.cells) grid[gy + y][gx + x] = p.col;
  p.used = true; score += p.cells.length; S.place(); buzz(10);
  const { rows, cols } = fullLines(grid), n = rows.length + cols.length;
  if (n) {
    combo++;
    const t0 = performance.now(), seen = new Set();
    const add = (x, y, d) => {
      const k = x + ',' + y; if (seen.has(k)) return; seen.add(k);
      pops.push({ x, y, col: grid[y][x], t0: t0 + d * 35 });
      const [c1] = FLOWERS[grid[y][x]];
      for (let i = 0; i < 4; i++) petals.push({ x: bx + (x + .5) * cell, y: by + (y + .5) * cell, vx: (Math.random() - .5) * 6, vy: -Math.random() * 5 - 1, a: Math.random() * 6, va: (Math.random() - .5) * .3, life: 1, c: c1 });
    };
    for (const r of rows) for (let x = 0; x < N; x++) add(x, r, x);
    for (const c of cols) for (let y = 0; y < N; y++) add(c, y, y);
    let golds = 0;
    for (const k of seen) { const [x, y] = k.split(',').map(Number); if (grid[y][x] === GOLD) golds++; grid[y][x] = -1; }
    const gain = 10 * n * n + (combo - 1) * 10 * n + golds * GOLD_BONUS;
    score += gain; runLines += n; lines += n; store.set('ob_lines', lines);
    if (golds) { floats.push({ text: `Złote kwiaty +${golds * GOLD_BONUS}`, x: W / 2, y: by + cell * N / 2 - 44, c: '#ffd35a', size: 24, t0: t0 + 60 }); tone(1568, .4, 'sine', .07, .15); }
    const cx = bx + (gx + 1) * cell, cy = by + gy * cell;
    floats.push({ text: '+' + gain, x: cx, y: cy, c: '#ffe27a', size: 30, t0 });
    if (n > 1) floats.push({ text: ['', '', 'Podwójnie!', 'Potrójnie!', 'Ogród marzeń!'][Math.min(n, 4)], x: W / 2, y: by + cell * N / 2, c: '#fff', size: 36, t0 });
    if (combo > 1) floats.push({ text: 'Seria x' + combo, x: W / 2, y: by + cell * N / 2 + 42, c: '#ffb347', size: 26, t0: t0 + 120 });
    if (grid.every(r => r.every(v => v < 0))) { score += 300; floats.push({ text: 'Czysta grządka! +300', x: W / 2, y: by + cell * 2, c: '#7dffa0', size: 26, t0: t0 + 300 }); }
    S.clear(n, combo); buzz([20, 30, 20]);
  } else combo = 0;
  if (tray.every(q => q.used)) refill();
  if (mode === 'classic' && score > best) { best = score; store.set('ob_best', best); }
  hud();
  if (!tray.some(q => !q.used && canPlaceAnywhere(q.cells))) setTimeout(gameOver, 700);
}
function gameOver() {
  if (state !== 'play') return;
  state = 'over'; S.over(); buzz(80);
  $('final').textContent = score;
  const ln = `${runLines} ${runLines === 1 ? 'linia' : runLines % 10 >= 2 && runLines % 10 <= 4 && (runLines % 100 < 12 || runLines % 100 > 14) ? 'linie' : 'linii'}`;
  if (mode === 'daily') {
    const today = dayKey(), prev = dailyBest();
    if (streak.last !== today) { streak = { last: today, n: streak.last === yesterdayKey() ? streak.n + 1 : 1 }; store.set('ob_streak', streak); }
    if (score > prev) store.set('ob_daily_' + today, score);
    $('overT').textContent = 'Wyzwanie dnia';
    $('overInfo').textContent = `${ln} · ${score > prev ? (prev ? 'lepiej niż wcześniej dziś! 🌼' : 'pierwszy wynik dnia 🌼') : 'dziś najlepiej: ' + prev} · seria ${streak.n} ${streak.n === 1 ? 'dzień' : 'dni'}`;
  } else {
    $('overT').textContent = 'Brak miejsca!';
    $('overInfo').textContent = `${ln} · ` + (score >= best && score > 0 ? 'nowy rekord! 🌸' : 'rekord: ' + best);
  }
  $('overRank').innerHTML = rankHtml();
  $('over').classList.add('show');
}

$('play').onclick = () => { audio(); newGame('classic'); };
$('daily').onclick = () => { audio(); newGame('daily'); };
$('again').onclick = () => newGame();
$('toMenu').onclick = showMenu;
$('menuBtn').onclick = () => { if (state === 'play') showMenu(); };
$('snd').onclick = () => { muted = !muted; store.set('ob_muted', muted); hud(); };

function loop(t) { draw(t); requestAnimationFrame(loop); }
resize(); hud(); tray = []; showMenu(); requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { if (document.hidden && actx) actx.suspend(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
