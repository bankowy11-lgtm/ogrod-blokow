<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12261a">
<title>Ogród Bloków</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Ogród: głęboka zieleń trawnika, kremowe karty jak papierowe etykiety nasion, złote akcenty. Wynik i cele u góry, grządka w środku, klocki na dole. */
  :root {
    --bg: #12261a; --panel: rgba(10,26,16,.74); --ink: #f3f7ea; --muted: #b9d3a8;
    --cream: #fbf4e2; --cream-2: #f1e6c8; --forest: #1f4a2e; --forest-2: #2d6a40; --bark: #6b4a2a;
    --gold: #ffd35a; --gold-ink: #3a2600; --gold-deep: #b8861d; --leaf: #7dffa0; --cyan: #7fe9ff; --rose: #e2566f; --line: rgba(255,255,255,.14);
    --display: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; --ui: system-ui, "Segoe UI", Roboto, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--ui); color: var(--ink); }
  #cv { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  button { font-family: var(--ui); color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* górny pasek: menu · liczniki · podpowiedź; pod nim cele rundy */
  #top { position: fixed; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 44px 1fr 44px; align-items: start; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    pointer-events: none; transition: opacity .3s, visibility .3s; visibility: hidden; opacity: 0; }
  #top > * { pointer-events: auto; }
  .round { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 18px; display: grid; place-items: center; color: var(--ink); }
  .round:active { transform: scale(.94); }
  .round .n { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--gold); color: var(--gold-ink); font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; box-sizing: border-box; }
  .round[disabled] { opacity: .4; }
  .stats { display: flex; justify-content: center; gap: 5px; min-width: 0; }
  .stat { flex: 1 1 0; min-width: 0; max-width: 84px; padding: 5px 4px 6px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); text-align: center; }
  .stat small { display: block; font-size: 9px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat b { display: block; font: 800 20px/1.1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat.main b { color: #fff; font-size: 22px; }
  .stat.warn b { color: #ff8a8a; }
  #goals { grid-column: 1 / -1; display: flex; justify-content: center; gap: 5px; margin-top: 2px; flex-wrap: wrap; }
  .goal { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .goal.done { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); }
  #timebar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; display: none; }
  #timebar i { display: block; height: 100%; background: var(--leaf); transition: width .2s linear; }

  #toast { position: fixed; left: 50%; top: calc(146px + env(safe-area-inset-top)); transform: translate(-50%, -8px); opacity: 0;
    padding: 9px 14px; border-radius: 14px; background: var(--cream); color: var(--forest); font-size: 13.5px; font-weight: 700;
    max-width: min(320px, calc(100vw - 32px)); text-align: center; transition: opacity .25s, transform .25s; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* nakładki: kremowe karty, płynne wejście */
  .ov { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,20,12,.66);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto; scrollbar-width: none;
    opacity: 0; visibility: hidden; transition: opacity .28s, visibility .28s; }
  .ov::-webkit-scrollbar { display: none; }
  .ov.show { opacity: 1; visibility: visible; }
  .sheet { margin: calc(16px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    width: min(372px, calc(100vw - 28px)); box-sizing: border-box; background: var(--cream); color: var(--forest); border-radius: 26px; padding: 22px 18px;
    text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.5); transform: translateY(18px) scale(.98); transition: transform .32s cubic-bezier(.2,1,.3,1); }
  .ov.show .sheet { transform: none; }
  .eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--forest-2); font-weight: 800; }
  .sheet h1 { margin: 4px 0 6px; font: 800 44px/1.02 var(--display); color: var(--forest); }
  .sheet h1 span { color: var(--gold-deep); }
  .sheet h2 { margin: 2px 0 6px; font: 800 28px/1.1 var(--display); color: var(--forest); text-wrap: balance; }
  .sheet p { color: #4d5e45; margin: 6px 0 14px; line-height: 1.45; font-size: 14.5px; }
  .big { background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 20px; padding: 14px 30px; width: 100%;
    font: 800 19px var(--ui); box-shadow: 0 5px 0 var(--gold-deep); }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-deep); }
  .btn2 { background: transparent; border: 2px solid var(--forest); color: var(--forest); border-radius: 18px; padding: 11px 16px; font: 800 15px var(--ui); width: 100%; }
  .btn2:active { transform: scale(.97); }
  .link { background: none; border: 0; color: var(--forest-2); font-weight: 800; font-size: 14px; padding: 10px; }
  .stack { display: grid; gap: 10px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; justify-content: center; gap: 8px; margin: 10px 0 12px; }
  .chip { flex: 1 1 0; max-width: 96px; background: var(--cream-2); border-radius: 14px; padding: 6px 4px 7px; }
  .chip small { display: block; font-size: 9.5px; letter-spacing: .8px; text-transform: uppercase; color: #6c7a5f; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip b { display: block; font: 800 20px/1.1 var(--display); font-variant-numeric: tabular-nums; color: var(--forest); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .mode { background: #fff; border: 2px solid var(--cream-2); border-radius: 16px; padding: 10px 8px; text-align: left; color: var(--forest); }
  .mode b { display: block; font: 800 15px var(--display); }
  .mode small { display: block; font-size: 11.5px; color: #6c7a5f; margin-top: 2px; line-height: 1.3; }
  .mode:active { transform: scale(.97); }
  .num { font: 900 56px/1 var(--display); color: var(--forest); margin: 4px 0 0; font-variant-numeric: tabular-nums; }
  .stars { display: flex; justify-content: center; gap: 8px; font-size: 34px; line-height: 1; margin: 6px 0 2px; }
  .stars span { color: #ddd1ad; }
  .stars span.on { color: var(--gold-deep); animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
  .stars span.on:nth-child(2) { animation-delay: .15s; } .stars span.on:nth-child(3) { animation-delay: .3s; }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }
  .glist { text-align: left; display: grid; gap: 6px; margin: 8px 0 12px; }
  .gl { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: #fff; border-radius: 12px; padding: 8px 10px; font-size: 13.5px; font-weight: 700; }
  .gl span:last-child { color: #6c7a5f; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .gl.done span:last-child { color: var(--forest-2); }
  .rank { background: #fff; border-radius: 14px; padding: 10px 12px; margin-top: 10px; text-align: left; }
  .rank .t { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; gap: 8px; }
  .rank .t span:last-child { color: #6c7a5f; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rank .s { font-size: 12px; color: #6c7a5f; margin-top: 2px; }
  .bar { height: 6px; background: var(--cream-2); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--forest-2); border-radius: 3px; }
  .seeds { display: inline-flex; align-items: center; gap: 6px; background: var(--forest); color: var(--cream); border-radius: 14px; padding: 5px 12px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .theme { background: #fff; border: 2px solid var(--cream-2); border-radius: 18px; padding: 8px; display: grid; gap: 6px; justify-items: center; }
  .theme.sel { border-color: var(--gold-deep); box-shadow: 0 0 0 3px rgba(224,165,38,.25); }
  .theme canvas { width: 100%; max-width: 140px; aspect-ratio: 7 / 4; border-radius: 12px; }
  .theme b { font: 800 13.5px var(--display); }
  .theme button { width: 100%; border: 0; border-radius: 12px; padding: 7px 4px; font-weight: 800; font-size: 13px; background: var(--gold); color: var(--gold-ink); }
  .theme button.own { background: var(--cream-2); color: var(--forest); }
  .theme button.no { background: #eee6cf; color: #a59c80; }
  .toggle { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 14px; padding: 10px 12px; font-weight: 800; font-size: 15px; border: 0; color: var(--forest); width: 100%; }
  .toggle span:last-child { font-size: 13px; background: var(--forest); color: var(--cream); padding: 4px 10px; border-radius: 10px; }
  .toggle.off span:last-child { background: #ddd1ad; color: var(--forest); }
  @media (prefers-reduced-motion: reduce) { .ov, .sheet, #toast { transition: none; } .stars span.on { animation: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <button class="round" id="pauseBtn" aria-label="Pauza">❚❚</button>
  <div class="stats">
    <div class="stat main"><small id="scoreL">Wynik</small><b id="score">0</b></div>
    <div class="stat"><small id="bestL">Rekord</small><b id="best">0</b></div>
    <div class="stat" id="thirdStat"><small id="thirdL">Linie</small><b id="third">0</b></div>
  </div>
  <button class="round" id="hintBtn" aria-label="Podpowiedź">✦<span class="n" id="hintN">3</span></button>
  <div id="timebar"><i id="timefill"></i></div>
  <div id="goals"></div>
</div>
<div id="toast" role="status"></div>

<!-- menu główne -->
<div class="ov show" id="menu" aria-hidden="false"><div class="sheet">
  <div class="eyebrow" id="tagline">Kwiatowa łamigłówka</div>
  <h1 id="title">Ogród <span>Bloków</span></h1>
  <div class="chips">
    <div class="chip"><small id="mBestL">Rekord</small><b id="mBest">0</b></div>
    <div class="chip"><small id="mSeedsL">Nasiona</small><b id="mSeeds">0</b></div>
    <div class="chip"><small id="mStreakL">Seria dni</small><b id="mStreak">0</b></div>
  </div>
  <div class="stack">
    <button class="big" id="play">Graj</button>
    <button class="btn2" id="newGame" hidden>Nowa gra</button>
  </div>
  <div class="modes">
    <button class="mode" data-mode="daily"><b>🌼 <span id="mdDaily">Wyzwanie dnia</span></b><small id="mdDailyS"></small></button>
    <button class="mode" data-mode="timed"><b>⏱ <span id="mdTimed">Na czas</span></b><small id="mdTimedS"></small></button>
    <button class="mode" data-mode="relax"><b>🍃 <span id="mdRelax">Relaks</span></b><small id="mdRelaxS"></small></button>
    <button class="mode" id="toGarden"><b>🌸 <span id="mdGarden">Mój ogród</span></b><small id="mdGardenS"></small></button>
  </div>
  <div class="rank" id="rank"></div>
  <div><button class="link" id="toSettings">⚙ <span id="settingsL">Ustawienia</span></button></div>
</div></div>

<!-- pauza -->
<div class="ov" id="pause" aria-hidden="true"><div class="sheet">
  <div class="eyebrow" id="pauseEyebrow"></div>
  <h2 id="pauseT">Pauza</h2>
  <p id="pauseP">Gra jest zapisana. Możesz wrócić do niej później.</p>
  <div class="stack">
    <button class="big" id="resume">Wznów</button>
    <div class="pair"><button class="btn2" id="retry">↻ Od nowa</button><button class="btn2" id="home">⌂ Menu</button></div>
    <button class="toggle" id="sndT"><span id="sndL">Dźwięk</span><span id="sndV">wł.</span></button>
    <button class="toggle" id="vibT"><span id="vibL">Wibracje</span><span id="vibV">wł.</span></button>
  </div>
</div></div>

<!-- potwierdzenie -->
<div class="ov" id="confirm" aria-hidden="true"><div class="sheet">
  <h2 id="confT"></h2>
  <p id="confP"></p>
  <div class="pair"><button class="btn2" id="confNo">Anuluj</button><button class="big" id="confYes" style="padding:12px 10px">Tak</button></div>
</div></div>

<!-- koniec rundy -->
<div class="ov" id="over" aria-hidden="true"><div class="sheet">
  <div class="eyebrow" id="overEyebrow"></div>
  <h2 id="overT">Brak miejsca!</h2>
  <div class="num" id="final">0</div>
  <div class="stars" id="overStars"><span>★</span><span>★</span><span>★</span></div>
  <div class="chips">
    <div class="chip"><small id="oLinesL">Linie</small><b id="oLines">0</b></div>
    <div class="chip"><small id="oComboL">Seria</small><b id="oCombo">0</b></div>
    <div class="chip"><small id="oBestL">Rekord</small><b id="oBest">0</b></div>
  </div>
  <div class="glist" id="oGoals"></div>
  <div><span class="seeds" id="oSeeds">+0 🌱</span></div>
  <div class="rank" id="overRank"></div>
  <div class="stack" style="margin-top:14px">
    <button class="big" id="again">Jeszcze raz</button>
    <div class="pair"><button class="btn2" id="overGarden">🌸 Mój ogród</button><button class="btn2" id="toMenu">⌂ Menu</button></div>
  </div>
</div></div>

<!-- mój ogród: motywy za nasiona -->
<div class="ov" id="garden" aria-hidden="true"><div class="sheet">
  <div class="eyebrow" id="gardenEyebrow">Mój ogród</div>
  <h2 id="gardenT">Nowe rabaty</h2>
  <p id="gardenP">Za nasiona z rund odblokowujesz nowe kwiaty i wygląd ogrodu.</p>
  <span class="seeds" id="gSeeds">0 🌱</span>
  <div class="themes" id="themes"></div>
  <button class="btn2" id="gardenBack">← <span id="backL">Wróć</span></button>
</div></div>

<!-- ustawienia -->
<div class="ov" id="settings" aria-hidden="true"><div class="sheet">
  <h2 id="setT">Ustawienia</h2>
  <div class="stack" style="margin-top:10px">
    <button class="toggle" id="sndT2"><span id="sndL2">Dźwięk</span><span id="sndV2">wł.</span></button>
    <button class="toggle" id="vibT2"><span id="vibL2">Wibracje</span><span id="vibV2">wł.</span></button>
    <button class="btn2" id="tutAgain">Pokaż samouczek</button>
    <button class="big" id="setBack">OK</button>
  </div>
</div></div>

<script>
'use strict';
const N = 8, HINTS = 3, TIMED_SECS = 120;
// język: polski dla telefonów ustawionych na polski, dla wszystkich innych angielski
const LANG = (navigator.languages && navigator.languages[0] || navigator.language || 'en').toLowerCase().startsWith('pl') ? 'pl' : 'en';
const tr = (pl, en) => LANG === 'pl' ? pl : en;
document.documentElement.lang = LANG;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let best = store.get('ob_best', 0), bestTimed = store.get('ob_best_timed', 0), muted = store.get('ob_muted', false), vibe = store.get('ob_vibe', true);
let lines = store.get('ob_lines', 0), streak = store.get('ob_streak', { last: '', n: 0 }), seeds = store.get('ob_seeds', 0);
let owned = store.get('ob_themes', ['meadow']), themeId = store.get('ob_theme', 'meadow'), tutDone = store.get('ob_tut', false);

// --- tryby gry ---
const MODES = {
  classic: { name: tr('Klasyczny', 'Classic') },
  daily: { name: tr('Wyzwanie dnia', 'Daily challenge') },
  timed: { name: tr('Na czas', 'Time attack') },
  relax: { name: tr('Relaks', 'Relax') },
};

// generator liczb z zapisywanym stanem (wyzwanie dnia da się wznowić w tym samym miejscu)
function makeRng(seed) { const o = { s: seed >>> 0 }; o.next = () => { o.s = (o.s * 1664525 + 1013904223) >>> 0; return o.s / 4294967296; }; return o; }
let rs = null;
const rand = () => rs ? rs.next() : Math.random();
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const daySeed = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
const dailyBest = () => store.get('ob_daily_' + dayKey(), 0);
function yesterdayKey() { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); }
const liveStreak = () => streak.last === dayKey() || streak.last === yesterdayKey() ? streak.n : 0;

// rangi ogrodnika za łączną liczbę zebranych rzędów i kolumn
const RANKS = [[0, tr('Nowicjusz', 'Beginner')], [25, tr('Sadzonka', 'Seedling')], [75, tr('Pączek', 'Bud')], [150, tr('Kwiatek', 'Blossom')],
  [300, tr('Ogrodnik', 'Gardener')], [500, tr('Sadownik', 'Orchardist')], [800, tr('Botanik', 'Botanist')], [1200, tr('Mistrz ogrodu', 'Garden Master')],
  [1800, tr('Strażnik róż', 'Rose Keeper')], [2500, tr('Legenda ogrodu', 'Garden Legend')]];
const rankOf = n => { let i = 0; while (i + 1 < RANKS.length && n >= RANKS[i + 1][0]) i++; return i; };
function rankHtml() {
  const i = rankOf(lines), next = RANKS[i + 1];
  const pct = next ? Math.round((lines - RANKS[i][0]) / (next[0] - RANKS[i][0]) * 100) : 100;
  return `<div class="t"><span>🌱 ${RANKS[i][1]}</span><span>${tr('ranga', 'rank')} ${i + 1} / ${RANKS.length}</span></div>
    <div class="s">${next ? tr(`zebrane linie: ${lines} · do rangi „${next[1]}” brakuje ${next[0] - lines}`, `lines cleared: ${lines} · ${next[0] - lines} more to “${next[1]}”`)
      : tr(`zebrane linie: ${lines} · najwyższa ranga!`, `lines cleared: ${lines} · top rank!`)}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
}

// --- motywy ogrodu (odblokowywane za nasiona) ---
const GOLD_FLOWER = ['#fff6c2', '#ffb300'];
const THEMES = [
  { id: 'meadow', name: tr('Wiosenna łąka', 'Spring Meadow'), price: 0, petals: 5,
    flowers: [['#ff6b8b', '#ffe27a'], ['#ffb347', '#fff1b8'], ['#b48cff', '#ffe27a'], ['#5ac8ff', '#fff'], ['#ff5a5a', '#ffd35a'], ['#ffe14a', '#ff9a3c'], ['#f5f5ff', '#ffd35a']],
    leaf: ['#2f7a3d', '#3d9a4c'], soil: ['#4a2f1d', '#5c3b25', '#63412a'], bg: ['#163222', '#1a3a27'] },
  { id: 'roses', name: tr('Różany ogród', 'Rose Garden'), price: 60, petals: 7,
    flowers: [['#e63950', '#ffd6dc'], ['#ff7a9c', '#fff0f3'], ['#b5173a', '#ff9eb0'], ['#fff4f6', '#ffc2cf'], ['#ff9f80', '#fff1d6'], ['#c94fa0', '#ffd1ee'], ['#ffd1dc', '#e63950']],
    leaf: ['#2a6136', '#357a45'], soil: ['#3d2418', '#4f3020', '#573624'], bg: ['#13291b', '#173220'] },
  { id: 'tulips', name: tr('Tulipanowe pola', 'Tulip Fields'), price: 120, petals: 4,
    flowers: [['#ff4d4d', '#ffe27a'], ['#ff9933', '#fff1b8'], ['#ffd23f', '#ff8c1a'], ['#b84dff', '#ffe27a'], ['#ff66b3', '#fff'], ['#ffffff', '#ffd23f'], ['#ff3d6e', '#ffd23f']],

    const own = owned.includes(th.id), isSel = th.id === theme.id;
    const lbl = isSel ? tr('Wybrany', 'Selected') : own ? tr('Wybierz', 'Use') : th.price + ' 🌱';
    return `<div class="theme${isSel ? ' sel' : ''}"><canvas width="168" height="96" data-th="${th.id}"></canvas><b>${th.name}</b>
      <button data-buy="${th.id}" class="${isSel || own ? 'own' : seeds < th.price ? 'no' : ''}">${lbl}</button></div>`;
  }).join('');
  document.querySelectorAll('canvas[data-th]').forEach(c => themePreview(c, THEMES.find(t => t.id === c.dataset.th)));
}
$('themes').addEventListener('click', e => {
  const b = e.target.closest('button[data-buy]'); if (!b) return;
  const th = THEMES.find(t => t.id === b.dataset.buy);
  if (!owned.includes(th.id)) {
    if (seeds < th.price) { toast(tr(`Brakuje ${th.price - seeds} nasion. Zdobywaj je za cele i punkty w rundach.`, `You need ${th.price - seeds} more seeds. Earn them from round goals and points.`)); S.bad(); return; }
    seeds -= th.price; owned.push(th.id); store.set('ob_seeds', seeds); store.set('ob_themes', owned); S.goal(); buzz(30);
    toast(tr('Nowa rabata: ', 'New garden: ') + th.name + ' 🌸');
  }
  theme = th; store.set('ob_theme', th.id); buildBg(); renderGarden();
});
let gardenBack = 'menu';
function openGarden(from) { gardenBack = from; renderGarden(); showOv('garden'); }

// --- przyciski ---
function syncToggles() {
  for (const [k, v] of [['sndV', !muted], ['sndV2', !muted], ['vibV', vibe], ['vibV2', vibe]]) { $(k).textContent = v ? tr('wł.', 'on') : tr('wył.', 'off'); $(k).parentElement.classList.toggle('off', !v); }
}
function toggleSound() { muted = !muted; store.set('ob_muted', muted); syncToggles(); if (!muted) { audio(); tone(880, .1, 'triangle', .05); } }
function toggleVibe() { vibe = !vibe; store.set('ob_vibe', vibe); syncToggles(); buzz(30); }
$('play').onclick = () => { audio(); if (!resumeSaved()) newGame('classic'); };
$('newGame').onclick = () => startMode('classic');
document.querySelectorAll('.mode[data-mode]').forEach(b => b.onclick = () => { audio(); startMode(b.dataset.mode); });
$('toGarden').onclick = () => openGarden('menu');
$('overGarden').onclick = () => openGarden('over');
$('gardenBack').onclick = () => gardenBack === 'over' ? showOv('over') : showMenu();
$('again').onclick = () => newGame(mode);
$('toMenu').onclick = showMenu;
$('pauseBtn').onclick = () => { if (state !== 'play') return; state = 'paused'; save(); $('pauseEyebrow').textContent = MODES[mode].name + ' · ' + score + ' ' + tr('pkt', 'pts'); syncToggles(); showOv('pause'); };
$('resume').onclick = () => { state = 'play'; lastT = 0; showOv(null); };
$('retry').onclick = () => ask(tr('Zacząć od nowa?', 'Restart?'), tr(`Obecna runda (${score} pkt) przepadnie.`, `This round (${score} pts) will be lost.`), tr('Od nowa', 'Restart'), () => { store.del('ob_save'); newGame(mode); });
$('home').onclick = showMenu;
$('confNo').onclick = () => { confirmCb = null; state === 'paused' ? showOv('pause') : showMenu(); };
$('confYes').onclick = () => { const cb = confirmCb; confirmCb = null; cb && cb(); };
$('hintBtn').onclick = useHint;
$('sndT').onclick = $('sndT2').onclick = toggleSound;
$('vibT').onclick = $('vibT2').onclick = toggleVibe;
$('toSettings').onclick = () => { syncToggles(); showOv('settings'); };
$('setBack').onclick = showMenu;
$('tutAgain').onclick = () => { tutDone = false; store.set('ob_tut', false); toast(tr('Samouczek pojawi się w następnej grze.', 'The tutorial will show in your next game.')); };
addEventListener('keydown', e => { if (e.key === 'Escape' && state === 'play') $('pauseBtn').onclick(); });

function applyTexts() {
  document.title = tr('Ogród Bloków', 'Block Garden');
  $('title').innerHTML = tr('Ogród <span>Bloków</span>', 'Block <span>Garden</span>');
  $('tagline').textContent = tr('Kwiatowa łamigłówka', 'A flower block puzzle');
  $('mBestL').textContent = tr('Rekord', 'Best'); $('mSeedsL').textContent = tr('Nasiona', 'Seeds'); $('mStreakL').textContent = tr('Seria dni', 'Day streak');
  $('newGame').textContent = tr('Nowa gra', 'New game');
  $('mdDaily').textContent = MODES.daily.name; $('mdTimed').textContent = MODES.timed.name; $('mdRelax').textContent = MODES.relax.name; $('mdGarden').textContent = tr('Mój ogród', 'My garden');
  $('settingsL').textContent = tr('Ustawienia', 'Settings');
  $('pauseT').textContent = tr('Pauza', 'Paused'); $('pauseP').textContent = tr('Gra jest zapisana. Możesz wrócić do niej później.', 'Your game is saved. You can come back to it later.');
  $('resume').textContent = tr('Wznów', 'Resume'); $('retry').textContent = '↻ ' + tr('Od nowa', 'Restart'); $('home').textContent = '⌂ Menu';
  for (const s of ['', '2']) { $('sndL' + s).textContent = tr('Dźwięk', 'Sound'); $('vibL' + s).textContent = tr('Wibracje', 'Vibration'); }
  $('confNo').textContent = tr('Anuluj', 'Cancel');
  $('oLinesL').textContent = tr('Linie', 'Lines'); $('oComboL').textContent = tr('Seria', 'Combo');
  $('again').textContent = tr('Jeszcze raz', 'Play again'); $('overGarden').textContent = '🌸 ' + tr('Mój ogród', 'My garden'); $('toMenu').textContent = '⌂ Menu';
  $('gardenEyebrow').textContent = tr('Mój ogród', 'My garden'); $('gardenT').textContent = tr('Nowe rabaty', 'New gardens');
  $('gardenP').textContent = tr('Za nasiona z rund odblokowujesz nowe kwiaty i wygląd ogrodu.', 'Spend seeds from your rounds to unlock new flowers and garden looks.');
  $('backL').textContent = tr('Wróć', 'Back');
  $('setT').textContent = tr('Ustawienia', 'Settings'); $('tutAgain').textContent = tr('Pokaż samouczek', 'Show tutorial');
  $('pauseBtn').setAttribute('aria-label', tr('Pauza', 'Pause')); $('hintBtn').setAttribute('aria-label', tr('Podpowiedź', 'Hint'));
}
applyTexts();

function loop(t) { draw(t); requestAnimationFrame(loop); }
resize(); showMenu(); requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') { $('pauseBtn').onclick(); } save(); if (actx) actx.suspend(); }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
