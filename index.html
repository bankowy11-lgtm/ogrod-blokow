<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12261a">
<title>Ogród Bloków</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Ogród: głęboka zieleń trawnika, kremowe karty jak papierowe etykiety nasion, złote akcenty. Wynik i cele u góry, grządka w środku, klocki i narzędzia na dole. */
  :root {
    --bg: #12261a; --panel: rgba(10,26,16,.74); --ink: #f3f7ea; --muted: #b9d3a8;
    --cream: #fbf4e2; --cream-2: #f1e6c8; --forest: #1f4a2e; --forest-2: #2d6a40; --bark: #6b4a2a;
    --gold: #ffd35a; --gold-ink: #3a2600; --gold-deep: #b8861d; --leaf: #7dffa0; --cyan: #7fe9ff; --rose: #e2566f; --line: rgba(255,255,255,.14);
    --display: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif; --ui: "Nunito", system-ui, "Segoe UI", Roboto, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--ui); color: var(--ink); }
  #cv { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  button { font-family: var(--ui); color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* górny pasek: pauza · liczniki · dźwięk; pod nim cele rundy z paskami postępu */
  #top { position: fixed; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 44px 1fr 44px; align-items: start; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    pointer-events: none; transition: opacity .3s, visibility .3s; visibility: hidden; opacity: 0; }
  #top > * { pointer-events: auto; }
  .round { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 18px; display: grid; place-items: center; color: var(--ink); }
  .round:active { transform: scale(.94); }
  .stats { display: flex; justify-content: center; gap: 5px; min-width: 0; }
  .stat { flex: 1 1 0; min-width: 0; max-width: 84px; padding: 5px 4px 6px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); text-align: center; }
  .stat small { display: block; font-size: 9px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat b { display: block; font: 800 20px/1.1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat.main b { color: #fff; font-size: 22px; }
  .stat.warn b { color: #ff8a8a; }
  #goals { grid-column: 1 / -1; display: flex; justify-content: center; gap: 5px; margin-top: 2px; }
  .goal { position: relative; overflow: hidden; font-size: 11px; font-weight: 700; padding: 4px 8px 6px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .goal i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--leaf); border-radius: 0 2px 2px 0; transition: width .3s; }
  .goal.done { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); }
  .goal.done i { background: transparent; }
  #timebar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; display: none; }
  #timebar i { display: block; height: 100%; background: var(--leaf); transition: width .2s linear; }

  /* dolny pasek: narzędzia ogrodnika */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px;
    padding: 0 max(12px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    visibility: hidden; opacity: 0; transition: opacity .3s, visibility .3s; }
  .tool { display: grid; justify-items: center; gap: 1px; min-width: 62px; padding: 5px 8px 6px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); font-size: 10.5px; font-weight: 800; color: var(--ink); line-height: 1.1; }
  .tool .i { font-size: 18px; }
  .tool:active { transform: scale(.96); }
  .tool[disabled] { opacity: .38; }
  .tool.hint { border-color: rgba(127,233,255,.45); }
  .tools-n { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; color: var(--gold); white-space: nowrap; }
  .tool.pulse { animation: pulse 1s ease-in-out infinite; border-color: var(--gold); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255,211,90,.35); } }

  #toast { position: fixed; left: 50%; top: calc(150px + env(safe-area-inset-top)); transform: translate(-50%, -8px); opacity: 0;
    padding: 9px 14px; border-radius: 14px; background: var(--cream); color: var(--forest); font-size: 13.5px; font-weight: 700;
    max-width: min(320px, calc(100vw - 32px)); text-align: center; transition: opacity .25s, transform .25s; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* nakładki: kremowe karty, płynne wejście; ukryte są niewidoczne także dla czytników */
  .ov { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,20,12,.66);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto; scrollbar-width: none;
    opacity: 0; visibility: hidden; transition: opacity .28s, visibility .28s; }
  .ov::-webkit-scrollbar { display: none; }
  .ov.show { opacity: 1; visibility: visible; }
  .sheet { margin: calc(16px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    width: min(372px, calc(100vw - 28px)); box-sizing: border-box; background: var(--cream); color: var(--forest); border-radius: 26px; padding: 22px 18px;
    text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.5); transform: translateY(18px) scale(.98); transition: transform .32s cubic-bezier(.2,1,.3,1); }
  .ov.show .sheet { transform: none; }
  .eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--forest-2); font-weight: 800; }
  .sheet h1 { margin: 4px 0 6px; font: 800 44px/1.02 var(--display); color: var(--forest); }
  .sheet h1 span { color: var(--gold-deep); }
  .sheet h2 { margin: 2px 0 6px; font: 800 28px/1.1 var(--display); color: var(--forest); text-wrap: balance; }
  .sheet h3 { margin: 14px 0 6px; font: 800 15px var(--display); text-align: left; }
  .sheet p { color: #4d5e45; margin: 6px 0 14px; line-height: 1.45; font-size: 14.5px; }
  .sheet a { color: var(--forest-2); font-weight: 800; }
  .big { background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 20px; padding: 14px 30px; width: 100%;
    font: 800 19px var(--ui); box-shadow: 0 5px 0 var(--gold-deep); }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-deep); }
  .btn2 { background: #fff; border: 2px solid var(--forest); color: var(--forest); border-radius: 18px; padding: 11px 16px; font: 800 15px var(--ui); width: 100%; box-shadow: 0 4px 0 var(--forest); }
  .btn2:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--forest); }
  .link { background: none; border: 0; color: var(--forest-2); font-weight: 800; font-size: 14px; padding: 10px; }
  .stack { display: grid; gap: 10px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; justify-content: center; gap: 8px; margin: 10px 0 12px; }
  .chip { flex: 1 1 0; max-width: 96px; background: var(--cream-2); border-radius: 14px; padding: 6px 4px 7px; }
  .chip small { display: block; font-size: 9.5px; letter-spacing: .8px; text-transform: uppercase; color: #6c7a5f; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip b { display: block; font: 800 20px/1.1 var(--display); font-variant-numeric: tabular-nums; color: var(--forest); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .mode { background: #fff; border: 2px solid var(--cream-2); border-radius: 16px; padding: 10px 8px; text-align: left; color: var(--forest); box-shadow: 0 4px 0 var(--cream-2); }
  .mode b { display: block; font: 800 15px var(--display); }
  .mode small { display: block; font-size: 11.5px; color: #6c7a5f; margin-top: 2px; line-height: 1.3; }
  .mode:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--cream-2); }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
  .cal { display: flex; justify-content: space-between; gap: 4px; margin-top: 8px; }
  .cal span { flex: 1; text-align: center; font-size: 10.5px; font-weight: 800; color: #6c7a5f; background: var(--cream-2); border-radius: 10px; padding: 5px 0; line-height: 1.25; }
  .cal span.got { background: var(--forest-2); color: var(--cream); }
  .cal span.today { box-shadow: 0 0 0 2px var(--gold-deep); }
  .cal span b { display: block; font-size: 15px; }
  .num { font: 900 56px/1 var(--display); color: var(--forest); margin: 4px 0 0; font-variant-numeric: tabular-nums; }
  .stars { display: flex; justify-content: center; gap: 8px; font-size: 34px; line-height: 1; margin: 6px 0 2px; }
  .stars span { color: #ddd1ad; }
  .stars span.on { color: var(--gold-deep); animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
  .stars span.on:nth-child(2) { animation-delay: .15s; } .stars span.on:nth-child(3) { animation-delay: .3s; }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }
  .glist { text-align: left; display: grid; gap: 6px; margin: 8px 0 12px; }
  .gl { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: #fff; border-radius: 12px; padding: 8px 10px; font-size: 13.5px; font-weight: 700; }
  .gl span:last-child { color: #6c7a5f; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .gl.done span:last-child { color: var(--forest-2); }
  .gl .bar { flex: 0 0 60px; margin: 0; }
  .rank, .week { background: #fff; border-radius: 14px; padding: 10px 12px; margin-top: 10px; text-align: left; }
  .rank .t, .week .t { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; gap: 8px; }
  .rank .t span:last-child, .week .t span:last-child { color: #6c7a5f; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rank .s, .week .s { font-size: 12px; color: #6c7a5f; margin-top: 2px; }
  .week .w { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; margin-top: 6px; }
  .week .w span:last-child { font-variant-numeric: tabular-nums; color: #6c7a5f; white-space: nowrap; }
  .week .w.done span { color: var(--forest-2); }
  .bar { height: 6px; background: var(--cream-2); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--forest-2); border-radius: 3px; }
  .seeds { display: inline-flex; align-items: center; gap: 6px; background: var(--forest); color: var(--cream); border-radius: 14px; padding: 5px 12px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
  .theme { background: #fff; border: 2px solid var(--cream-2); border-radius: 18px; padding: 8px; display: grid; gap: 6px; justify-items: center; }
  .theme.sel { border-color: var(--gold-deep); box-shadow: 0 0 0 3px rgba(224,165,38,.25); }
  .theme canvas { width: 100%; max-width: 140px; aspect-ratio: 7 / 4; border-radius: 12px; }
  .theme b { font: 800 13.5px var(--display); }
  .theme button, .decor button { width: 100%; border: 0; border-radius: 12px; padding: 7px 4px; font-weight: 800; font-size: 13px; background: var(--gold); color: var(--gold-ink); }
  .theme button.own, .decor button.own { background: var(--cream-2); color: var(--forest); }
  .theme button.no, .decor button.no { background: #eee6cf; color: #a59c80; }
  .decors { display: grid; gap: 8px; margin: 8px 0 12px; }
  .decor { display: grid; grid-template-columns: 34px 1fr 96px; gap: 8px; align-items: center; background: #fff; border-radius: 14px; padding: 8px 10px; text-align: left; }
  .decor .ic { font-size: 24px; }
  .decor b { display: block; font: 800 14px var(--display); }
  .decor small { display: block; font-size: 11.5px; color: #6c7a5f; line-height: 1.3; }
  .toggle { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 14px; padding: 10px 12px; font-weight: 800; font-size: 15px; border: 0; color: var(--forest); width: 100%; }
  .toggle span:last-child { font-size: 13px; background: var(--forest); color: var(--cream); padding: 4px 10px; border-radius: 10px; }
  .toggle.off span:last-child { background: #ddd1ad; color: var(--forest); }
  .note { font-size: 12.5px; color: #6c7a5f; text-align: left; background: var(--cream-2); border-radius: 12px; padding: 9px 11px; line-height: 1.4; }

  /* pora roku i zielnik */
  .season { background: #fff; border-radius: 14px; padding: 10px 12px; margin-top: 10px; text-align: left; }
  .season .t { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; gap: 8px; }
  .season .t span:last-child { color: #6c7a5f; font-weight: 700; white-space: nowrap; }
  .season .s { font-size: 12px; color: #6c7a5f; margin-top: 2px; }
  .herb { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 12px; text-align: center; }
  .card { background: #fff; border-radius: 16px; padding: 8px 6px 10px; display: grid; justify-items: center; gap: 3px; }
  .card canvas { width: 64px; height: 64px; }
  .card b { font: 800 13.5px var(--display); }
  .card small { font-size: 11px; color: #6c7a5f; line-height: 1.3; }
  .card.lock { background: var(--cream-2); }
  .card.lock canvas { filter: grayscale(1) brightness(.35); opacity: .45; }
  .card.legend { box-shadow: 0 0 0 2px var(--gold-deep); }
  .anim-spin canvas { animation: spin 9s linear infinite; }
  .anim-sway canvas { animation: sway 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
  .anim-pulse canvas { animation: pulse2 1.8s ease-in-out infinite; }
  .anim-glow canvas { animation: glow 2s ease-in-out infinite; }
  .anim-bob canvas { animation: bob 2.2s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes sway { 50% { transform: rotate(-10deg); } }
  @keyframes pulse2 { 50% { transform: scale(1.12); } }
  @keyframes glow { 50% { filter: drop-shadow(0 0 8px #ffd35a) brightness(1.15); } }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .card.lock canvas { animation: none; }

  /* telefon obrócony poziomo: prośba o pion */
  #rotate { position: fixed; inset: 0; display: none; place-items: center; background: var(--bg); color: var(--ink); text-align: center; padding: 24px; z-index: 5; font-weight: 800; font-size: 18px; }
  #rotate span { display: block; font-size: 48px; margin-bottom: 10px; }
  @media (orientation: landscape) and (max-height: 520px) { #rotate { display: grid; } }
  @media (prefers-reduced-motion: reduce) { .ov, .sheet, #toast { transition: none; } .stars span.on, .tool.pulse, .card canvas { animation: none !important; } }
</style>
</head>
<body>
<!-- SPLASH:start (gry/_narzedzia/splash.py) -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
#splash { position: fixed; inset: 0; z-index: 9999; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2.2vh; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); background: linear-gradient(#6fcaff 0%, #bfeeff 46%, #b6e57a 60%, #5cb544 80%, #3f8f33 100%); cursor: pointer; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; transition: opacity .55s ease, transform .55s ease;
  font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; }
#splash.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
#splash .art { position: absolute; inset: 0; pointer-events: none; }
#splash .sp-logo { position: relative; width: min(94vw, 460px); margin-top: -6vh; }
#splash .sp-logo svg { display: block; width: 100%; height: auto; overflow: visible; font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 700; }
#splash .logo-in { animation: spDrop 1.05s cubic-bezier(.2,1.5,.45,1) both; transform-origin: 200px 150px; transform-box: view-box; }
#splash .rib { animation: spRib .7s .55s cubic-bezier(.2,1.4,.4,1) both; transform-origin: 200px 260px; transform-box: view-box; }
#splash .sp-go { position: relative; font: 700 30px/1 "Fredoka", "Trebuchet MS", system-ui, sans-serif; letter-spacing: .5px; color: #5a2a00;
  padding: 18px 56px 20px; border: 0; border-radius: 999px; cursor: pointer;
  background: linear-gradient(#ffe066, #ffb21e); box-shadow: 0 7px 0 #7a4a00, 0 14px 28px rgba(0,0,0,.35), inset 0 3px 0 rgba(255,255,255,.6);
  animation: spIn .5s 1s both, spPulse 1.6s 1.6s ease-in-out infinite; }
#splash .sp-go:active { transform: translateY(5px); box-shadow: 0 2px 0 #7a4a00, inset 0 3px 0 rgba(255,255,255,.6); }
#splash .sp-hint { position: relative; font: 600 14px/1.2 "Fredoka", system-ui, sans-serif; color: #1f4a2e; opacity: .85; animation: spIn .5s 1.2s both; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
@keyframes spDrop { 0% { transform: translateY(-60vh) scale(.6); } 70% { transform: translateY(0) scale(1.04); } 100% { transform: none; } }
@keyframes spRib { 0% { transform: scaleX(0); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes spIn { 0% { transform: translateY(16px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes spPulse { 0%, 100% { scale: 1; } 50% { scale: 1.06; } }
@keyframes spFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
@keyframes spFall { 0% { transform: translate(0, -10vh) rotate(0); } 100% { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }
@keyframes spDrift { 0%, 100% { translate: 0 0; opacity: .25; } 50% { translate: var(--dx) var(--dy); opacity: 1; } }
@keyframes spTwinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
@keyframes spSpin { to { rotate: 360deg; } }
#splash .pt { position: absolute; pointer-events: none; }
/* ogród */
#splash .sp-sun { position: absolute; left: 50%; top: 4%; width: 150vmax; height: 150vmax; margin-left: -75vmax; margin-top: -75vmax;
  background: repeating-conic-gradient(rgba(255,255,255,.22) 0 7deg, rgba(255,255,255,0) 7deg 18deg); animation: spSpin 80s linear infinite;
  -webkit-mask: radial-gradient(circle, #000 0, transparent 55%); mask: radial-gradient(circle, #000 0, transparent 55%); }
#splash .sp-cloud { position: absolute; width: 150px; height: 46px; border-radius: 40px; background: #fff; opacity: .85;
  box-shadow: 30px -18px 0 4px #fff, 70px -6px 0 0 #fff; animation: spCloud var(--d) linear infinite; }
@keyframes spCloud { from { translate: 0 0; } to { translate: 120vw 0; } }
#splash .sp-hill { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34%; }
#splash .sp-blocks i { position: absolute; width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(145deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 75%, #000));
  box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 60%, #000), inset 0 2px 0 rgba(255,255,255,.5); rotate: var(--r); animation: spFloat var(--d) ease-in-out infinite; }
#splash .sp-flowers { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 15%; }
#splash .sw { animation: spSway 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes spSway { 0%, 100% { rotate: -6deg; } 50% { rotate: 6deg; } }
#splash .sp-leaf { position: absolute; width: 34vw; max-width: 170px; top: -2%; }
#splash .sp-leaf.l { left: -6%; rotate: 8deg; } #splash .sp-leaf.r { right: -6%; transform: scaleX(-1); rotate: -8deg; }
#splash .petal { width: 12px; height: 9px; border-radius: 60% 0 60% 0; background: var(--c); animation: spFall var(--t) linear infinite; animation-delay: var(--del); top: 0; }
/* świetliki */
#splash .sp-moon { position: absolute; right: 12%; top: 7%; width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fffbe6, #f2e3a8);
  box-shadow: 0 0 40px 12px rgba(255,240,180,.35), 0 0 120px 40px rgba(120,150,255,.25); }
#splash .star { width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: spTwinkle var(--t) ease-in-out infinite; animation-delay: var(--del); }

<script>
(() => {
  const sp = document.getElementById('splash'); if (!sp) return;
  const lang = (navigator.languages && navigator.languages[0] || navigator.language || 'en').toLowerCase().startsWith('pl') ? 'pl' : 'en';
  sp.querySelectorAll('.ln').forEach(g => { if (g.dataset.lang !== lang) g.remove(); });
  const sub = sp.querySelector('.sub'); sub.textContent = sub.dataset[lang];
  sp.querySelector('.sp-go').textContent = lang === 'pl' ? '▶ Graj' : '▶ Play';
  sp.querySelector('.sp-hint').textContent = lang === 'pl' ? 'Dotknij, aby zacząć' : 'Tap to start';
  sp.setAttribute('aria-label', lang === 'pl' ? 'Dotknij, aby zacząć' : 'Tap to start');
  // dopasowanie szerokości napisu do szerokości logo (np. długie „Świetliki”)
  const fit = () => sp.querySelectorAll('.ln').forEach(g => {
    const ts = g.querySelectorAll('text'), w = ts[1].getComputedTextLength(), fs = +ts[0].getAttribute('font-size');
    if (w > 352) ts.forEach(t => t.setAttribute('font-size', Math.floor(fs * 352 / w)));
  });
  const fitSub = () => { const t = sub.parentNode; t.setAttribute('font-size', 22); const w = sub.getComputedTextLength(); if (w > 262) t.setAttribute('font-size', Math.floor(22 * 262 / w)); };
  const fitAll = () => { fit(); fitSub(); };
  fitAll(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  // cząsteczki tła
  const art = sp.querySelector('.art'), kind = sp.dataset.pt, R = (a, b) => a + Math.random() * (b - a);
  const add = (cls, css) => { const e = document.createElement('i'); e.className = 'pt ' + cls; e.style.cssText = css; art.appendChild(e); };
  if (kind === 'petal') for (let i = 0; i < 18; i++) add('petal', `left:${R(0, 100)}%;--c:${['#ff9ec2', '#ffd1e3', '#fff', '#ffb3c7'][i % 4]};--t:${R(7, 13)}s;--del:${-R(0, 13)}s;--dx:${R(-60, 60)}px;--rot:${R(200, 700)}deg`);
  if (kind === 'firefly' || kind === 'star') for (let i = 0; i < 45; i++) add('star', `left:${R(0, 100)}%;top:${R(0, kind === 'star' ? 48 : 60)}%;--t:${R(2, 5)}s;--del:${-R(0, 5)}s`);
  if (kind === 'firefly') for (let i = 0; i < 16; i++) add('ff', `left:${R(4, 94)}%;top:${R(30, 88)}%;--t:${R(3, 7)}s;--del:${-R(0, 7)}s;--dx:${R(-50, 50)}px;--dy:${R(-50, 30)}px`);
  if (kind === 'screw') { const C = ['#ff5a5a', '#ffd23f', '#4fc3f7', '#7ddc6a', '#b18cff', '#ff9f43', '#cfd6e3'];
    [[6, 5], [82, 4], [38, 13], [70, 16], [5, 85], [80, 82], [46, 92], [12, 72], [86, 70]].forEach(([x, y], i) => add('screw', `left:${x}%;top:${y}%;--s:${R(34, 54)}px;--c:${C[i % C.length]};--t:${R(8, 18)}s`)); }
  // pełny ekran chowa pasek adresu w przeglądarce telefonu (w aplikacji z Play i po instalacji go nie ma)
  const installed = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
  const touch = matchMedia('(pointer: coarse)').matches;
  const goFS = () => {
    if (installed || !touch || document.fullscreenElement || document.webkitFullscreenElement) return;
    const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    try { const p = f && f.call(el, { navigationUI: 'hide' }); if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(() => {})).catch(() => {}); } catch (e) {}
  };
  document.addEventListener('click', e => { if (e.target.closest && e.target.closest('button')) goFS(); }, true);
  let gone = false;
  const go = e => { if (gone) return; gone = true; if (e) e.preventDefault(); goFS(); sp.classList.add('out'); setTimeout(() => sp.remove(), 600); };
  sp.addEventListener('click', go);
  sp.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') go(e); });
})();
</script>

function themePreview(c, th) {
  const x = c.getContext('2d'), w = c.width, h = c.height, s = h / 2 - 4;
  x.fillStyle = th.bg[0]; x.fillRect(0, 0, w, h); x.fillStyle = th.bg[1]; for (let y = 0; y < h; y += 20) x.fillRect(0, y, w, 10);
  x.fillStyle = th.soil[0]; rr(x, 6, 6, w - 12, h - 12, 10); x.fill();
  for (let i = 0; i < 6; i++) block(10 + (i % 3) * (s + 2) + (w - 3 * (s + 2) - 16) / 2, 8 + Math.floor(i / 3) * (s + 2), s, i, 1, 1, x, th);
}
function renderGarden() {
  $('gSeeds').textContent = seeds + ' 🌱';
  $('plantsList').innerHTML = PLANTS.map(pl => {
    const own = hasPlant(pl.id), lbl = own ? tr('Rośnie', 'Growing') : pl.streak ? tr('7 dni serii', '7-day streak') : pl.price + ' 🌱';
    return `<div class="decor"><span class="ic">${pl.ic}</span><span><b>${pl.name}</b><small>${pl.desc}</small></span>
      <button data-plant="${pl.id}" class="${own ? 'own' : pl.streak || seeds < pl.price ? 'no' : ''}">${lbl}</button></div>`;
  }).join('');
  $('decors').innerHTML = DECOR.map(d => {
    const own = decorOwned.includes(d.id), on = decorOn.includes(d.id);
    const lbl = own ? (on ? tr('Włączone', 'On') : tr('Wyłączone', 'Off')) : d.price + ' 🌱';
    return `<div class="decor"><span class="ic">${d.ic}</span><span><b>${d.name}</b><small>${d.desc}</small></span>
      <button data-decor="${d.id}" class="${own ? 'own' : seeds < d.price ? 'no' : ''}">${lbl}</button></div>`;
  }).join('');
  $('themes').innerHTML = THEMES.map(th => {
    const own = owned.includes(th.id), isSel = th.id === theme.id;
    const lbl = isSel ? tr('Wybrany', 'Selected') : own ? tr('Wybierz', 'Use') : th.price + ' 🌱';
    return `<div class="theme${isSel ? ' sel' : ''}"><canvas width="168" height="96" data-th="${th.id}"></canvas><b>${th.name}</b>
      <button data-buy="${th.id}" class="${isSel || own ? 'own' : seeds < th.price ? 'no' : ''}">${lbl}</button></div>`;
  }).join('');
  document.querySelectorAll('canvas[data-th]').forEach(c => themePreview(c, THEMES.find(t => t.id === c.dataset.th)));
}
function needSeeds(price) { toast(tr(`Brakuje ${price - seeds} nasion. Zdobywaj je za cele rund, punkty i wyzwania tygodnia.`, `You need ${price - seeds} more seeds. Earn them from round goals, points and weekly challenges.`)); S.bad(); }
$('themes').addEventListener('click', e => {
  const b = e.target.closest('button[data-buy]'); if (!b) return;
  const th = THEMES.find(t => t.id === b.dataset.buy);
  if (!owned.includes(th.id)) {
    if (seeds < th.price) { needSeeds(th.price); return; }
    seeds -= th.price; owned.push(th.id); store.set('ob_seeds', seeds); store.set('ob_themes', owned); S.goal(); buzz(30);
    toast(tr('Nowa rabata: ', 'New garden: ') + th.name + ' 🌸');
  }
  theme = th; store.set('ob_theme', th.id); buildBg(); renderGarden();
});
$('plantsList').addEventListener('click', e => {
  const b = e.target.closest('button[data-plant]'); if (!b) return;
  const pl = PLANTS.find(x => x.id === b.dataset.plant);
  if (hasPlant(pl.id)) return;
  if (pl.streak) { toast(tr('Złotą różę dostaniesz za 7 dni serii w wyzwaniu dnia.', 'You get the golden rose for a 7-day daily challenge streak.')); return; }
  if (seeds < pl.price) { needSeeds(pl.price); return; }
  seeds -= pl.price; plants.push(pl.id); store.set('ob_seeds', seeds); store.set('ob_plants', plants); S.goal(); buzz(30);
  toast(tr('Posadzono: ', 'Planted: ') + pl.ic + ' ' + pl.name); renderGarden();
});
$('decors').addEventListener('click', e => {
  const b = e.target.closest('button[data-decor]'); if (!b) return;
  const d = DECOR.find(x => x.id === b.dataset.decor);
  if (!decorOwned.includes(d.id)) {
    if (seeds < d.price) { needSeeds(d.price); return; }
    seeds -= d.price; decorOwned.push(d.id); decorOn.push(d.id); store.set('ob_seeds', seeds); store.set('ob_decor', decorOwned); S.goal(); buzz(30);
    toast(tr('Nowa dekoracja: ', 'New decoration: ') + d.ic + ' ' + d.name);
  } else decorOn = decorOn.includes(d.id) ? decorOn.filter(x => x !== d.id) : [...decorOn, d.id];
  store.set('ob_decor_on', decorOn); buildBg(); renderGarden();
});
let gardenBack = 'menu';
function openGarden(from) { gardenBack = from; renderGarden(); showOv('garden'); }

// --- instalacja na ekranie głównym ---
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
const isInstalled = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
async function installApp() {
  if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; return; }
  toast(tr('W Chrome: menu ⋮ → „Dodaj do ekranu głównego”. Na iPhonie: Udostępnij → „Do ekranu początkowego”.', 'In Chrome: menu ⋮ → “Add to Home screen”. On iPhone: Share → “Add to Home Screen”.'), 4000);
}

// --- przyciski ---
function syncToggles() {
  for (const [k, v] of [['sndV', !muted], ['sndV2', !muted], ['vibV', vibe], ['vibV2', vibe], ['musV', musicOn], ['musV2', musicOn], ['ambV2', ambOn]]) { $(k).textContent = v ? tr('wł.', 'on') : tr('wył.', 'off'); $(k).parentElement.classList.toggle('off', !v); }
  $('sndBtn').textContent = muted ? '🔇' : '🔊';
}
function toggleSound() { muted = !muted; store.set('ob_muted', muted); syncToggles(); if (!muted) { audio(); tone(880, .1, 'triangle', .05); } }
function toggleVibe() { vibe = !vibe; store.set('ob_vibe', vibe); syncToggles(); buzz(30); }
function toggleMusic() { musicOn = !musicOn; store.set('ob_music', musicOn); syncToggles(); }
function toggleAmb() { ambOn = !ambOn; store.set('ob_amb', ambOn); syncToggles(); }
$('ambT2').onclick = toggleAmb;
$('musT').onclick = $('musT2').onclick = toggleMusic;
$('toHerb').onclick = () => { renderHerb(); showOv('herbSheet'); };
$('herbBack').onclick = showMenu;
$('play').onclick = () => { audio(); if (!resumeSaved()) newGame('classic'); };
$('newGame').onclick = () => startMode('classic');
document.querySelectorAll('.mode[data-mode]').forEach(b => b.onclick = () => { audio(); startMode(b.dataset.mode); });
$('gsGo').onclick = beginRound;
$('toGarden').onclick = () => openGarden('menu');
$('overGarden').onclick = () => openGarden('over');
$('gardenBack').onclick = () => gardenBack === 'over' ? showOv('over') : showMenu();
$('again').onclick = () => newGame(mode);
$('toMenu').onclick = showMenu;
$('pauseBtn').onclick = () => { if (state !== 'play') return; state = 'paused'; save(); $('pauseEyebrow').textContent = MODES[mode].name + ' · ' + score + ' ' + tr('pkt', 'pts'); syncToggles(); showOv('pause'); };
$('resume').onclick = () => { state = 'play'; lastT = 0; showOv(null); };
$('retry').onclick = () => ask(tr('Zacząć od nowa?', 'Restart?'), tr(`Obecna runda (${score} pkt) przepadnie.`, `This round (${score} pts) will be lost.`), tr('Od nowa', 'Restart'),
  () => { store.del('ob_save'); newGame(mode); }, tr('Anuluj', 'Cancel'), () => showOv('pause'));
$('home').onclick = showMenu;
$('confNo').onclick = () => { const cb = confirmNoCb; confirmCb = confirmNoCb = null; cb ? cb() : showMenu(); };
$('confYes').onclick = () => { const cb = confirmCb; confirmCb = confirmNoCb = null; cb && cb(); };
$('hintBtn').onclick = useHint;
$('undoBtn').onclick = undo;
$('sndBtn').onclick = toggleSound;
$('sndT').onclick = $('sndT2').onclick = toggleSound;
$('vibT').onclick = $('vibT2').onclick = toggleVibe;
$('toSettings').onclick = () => { syncToggles(); $('install').hidden = isInstalled(); showOv('settings'); };
$('setBack').onclick = showMenu;
$('install').onclick = installApp;
$('tutAgain').onclick = () => { tutDone = false; store.set('ob_tut', false); toast(tr('Samouczek pojawi się w następnej grze.', 'The tutorial will show in your next game.')); };
addEventListener('keydown', e => { if (e.key === 'Escape' && state === 'play') $('pauseBtn').onclick(); });

function applyTexts() {
  document.title = tr('Ogród Bloków', 'Block Garden');
  $('title').innerHTML = tr('Ogród <span>Bloków</span>', 'Block <span>Garden</span>');
  $('tagline').textContent = tr('Kwiatowa łamigłówka', 'A flower block puzzle');
  $('mBestL').textContent = tr('Rekord', 'Best'); $('mSeedsL').textContent = tr('Nasiona', 'Seeds'); $('mStreakL').textContent = tr('Seria dni', 'Day streak');
  $('newGame').textContent = tr('Nowa gra', 'New game');
  $('mdDaily').textContent = MODES.daily.name; $('mdTimed').textContent = MODES.timed.name; $('mdRelax').textContent = MODES.relax.name; $('mdGarden').textContent = tr('Mój ogród', 'My garden');
  $('settingsL').textContent = tr('Ustawienia', 'Settings');
  $('undoL').textContent = tr('Cofnij', 'Undo'); $('hintL').textContent = tr('Podpowiedź', 'Hint');
  $('pauseT').textContent = tr('Pauza', 'Paused'); $('pauseP').textContent = tr('Gra jest zapisana. Możesz wrócić do niej później.', 'Your game is saved. You can come back to it later.');
  $('resume').textContent = tr('Wznów', 'Resume'); $('retry').textContent = '↻ ' + tr('Od nowa', 'Restart'); $('home').textContent = '⌂ Menu';
  for (const s of ['', '2']) { $('sndL' + s).textContent = tr('Dźwięk', 'Sound'); $('vibL' + s).textContent = tr('Wibracje', 'Vibration'); $('musL' + s).textContent = tr('Muzyka', 'Music'); }
  $('ambL2').textContent = tr('Odgłosy natury', 'Nature sounds');
  $('herbBack').textContent = '← ' + tr('Wróć', 'Back');
  $('again').textContent = tr('Jeszcze raz', 'Play again'); $('overGarden').textContent = '🌸 ' + tr('Mój ogród', 'My garden'); $('toMenu').textContent = '⌂ Menu';
  $('gardenEyebrow').textContent = tr('Mój ogród', 'My garden'); $('gardenT').textContent = tr('Rozbuduj ogród', 'Grow your garden');
  $('gardenP').textContent = tr('Za nasiona z rund kupujesz dekoracje i nowe rabaty. Wszystko widać potem w trakcie gry.', 'Spend seeds from your rounds on decorations and new gardens. You’ll see them while you play.');
  $('plantsH').textContent = tr('Rośliny z bonusami', 'Plants with bonuses'); $('decorH').textContent = tr('Dekoracje', 'Decorations'); $('themesH').textContent = tr('Rabaty', 'Gardens');
  $('gardenBack').textContent = '← ' + tr('Wróć', 'Back');
  $('setT').textContent = tr('Ustawienia', 'Settings'); $('tutAgain').textContent = tr('Pokaż samouczek', 'Show tutorial');
  $('install').textContent = '📲 ' + tr('Dodaj do ekranu głównego', 'Add to Home screen');
  $('privacyNote').innerHTML = tr('Gra działa bez konta i bez internetu. Wyniki i postęp są zapisywane tylko na tym urządzeniu. <a href="privacy.html" target="_blank" rel="noopener">Polityka prywatności</a>',
    'No account and no internet needed. Scores and progress are stored only on this device. <a href="privacy.html" target="_blank" rel="noopener">Privacy policy</a>');
  $('setBack').textContent = 'OK';
  $('rotateL').textContent = tr('Obróć telefon pionowo', 'Turn your phone upright');
  $('pauseBtn').setAttribute('aria-label', tr('Pauza', 'Pause')); $('sndBtn').setAttribute('aria-label', tr('Dźwięk', 'Sound'));
}
applyTexts();

function loop(t) { draw(t); requestAnimationFrame(loop); }
resize(); showMenu(); requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') { $('pauseBtn').onclick(); } save(); if (actx) actx.suspend(); }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>

<script>
(() => {
  const lang = (navigator.languages && navigator.languages[0] || navigator.language || 'en').toLowerCase().startsWith('pl') ? 'pl' : 'en';
  const t = (pl, en) => lang === 'pl' ? pl : en;
  const name = t('Ogród Bloków', 'Block Garden');
  const open = () => {
    let prog = ''; try { prog = localStorage.getItem('ob_best') || ''; } catch (e) {}
    const ua = navigator.userAgent, dev = (ua.match(/Android [^;)]+(;[^;)]+)?/) || [ua.slice(0, 80)])[0];
    const body = t('Napisz, co Ci się podoba, co jest niejasne albo co nie działa:', 'Tell us what you like, what is unclear or what does not work:')
      + '\n\n\n\n---\n' + name + ' 1.0.0\n' + dev + '\n' + screen.width + '×' + screen.height + ', ' + (navigator.language || '')
      + (prog ? '\n' + t('Rekord', 'Best') + ': ' + prog : '');
    location.href = 'mailto:bankowy11@gmail.com?subject=' + encodeURIComponent(t('Opinia', 'Feedback') + ': ' + name + ' 1.0.0') + '&body=' + encodeURIComponent(body);
  };
  const add = () => [['#menu .sheet', null],['#settings .sheet', '#privacyNote']].forEach(([box, before]) => {
    const host = document.querySelector(box); if (!host || host.querySelector('.fb-btn')) return;
    const w = document.createElement('div'); w.className = 'fb-wrap';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'fb-btn'; b.textContent = '✉ ' + t('Wyślij opinię', 'Send feedback');
    b.addEventListener('click', open); w.appendChild(b);
    const ref = before && host.querySelector(before); ref ? ref.parentNode.insertBefore(w, ref) : host.appendChild(w);
  });
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', add) : add();
})();
</script>
